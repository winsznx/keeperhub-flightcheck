[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]

# Pinned so the runtime bytecode is reproducible on any machine. Flightcheck fails closed
# when the code at the canary address does not hash to the pinned value, so that hash has to
# be something a third party can regenerate rather than something they take on trust.
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

# Solidity appends a CBOR metadata blob whose hash varies with source path and compiler
# metadata. Left on, two honest builds of identical source produce different runtime bytecode
# and the pin becomes unverifiable. Off, `forge build` is byte-reproducible.
bytecode_hash = "none"
cbor_metadata = false
